name: Pages

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build and check the release artifact
        run: npm run check
      - name: Upload checked Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  prune:
    # Keeps the repository's history to the live release: once this deploy succeeds,
    # older Pages deployments, finished workflow runs and their artifacts are deleted.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Delete older deployments, runs and artifacts
        run: |
          live=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0].id')
          if [ -z "$live" ]; then echo "No live Pages deployment found; nothing pruned." >&2; exit 1; fi
          # A deployment must be inactive before it can be deleted.
          for id in $(gh api --paginate "repos/$REPO/deployments?per_page=100" --jq ".[] | select(.id != $live) | .id"); do
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null
            gh api -X DELETE "repos/$REPO/deployments/$id"
            echo "Deleted deployment $id"
          done
          for id in $(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.workflow_run.id != $RUN_ID) | .id"); do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            echo "Deleted artifact $id"
          done
          # Only finished runs, so a newer push that is still building is left alone.
          for id in $(gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100" --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id"); do
            gh api -X DELETE "repos/$REPO/actions/runs/$id"
            echo "Deleted run $id"
          done
